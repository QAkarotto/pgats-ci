# CI de Nível 02 - Execução agendada

# nome da pipeline
name: "Schedule Execution"

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispach

on:
    schedule:
      # Cronograma de execução
      # Primeiro numero é minuto, Segundo é hora, Terceiro - dia do mês, 
      # Quarto - mês, Quinto - dia da semana
      - cron: '*/1 * * * *'

# tarefas dentro da pipeline = jobs

jobs:
    #nome do job
    e2e-tests:
        # maquina onde o job vai rodar
        runs-on: ubuntu-latest

        #passos do job
        steps:
            #clone do projeto
            - uses: actions/checkout@v4

            # instalação do node
            - uses: actions/setup-node@v4
              with:
                node-version: 24.x

            # instalação do Yarn
            - name: Instalando Yarn
              run: npm install -g yarn

            # instalação das dependências
            - name: Instalando dependências
              run: yarn

            # instalação dos Browser do Playwright
            - name: Instalando Browser do Playwright
              run: yarn playwright install

            # executar os testes e2e
            - name: Executando testes e2e
              run: yarn run e2e