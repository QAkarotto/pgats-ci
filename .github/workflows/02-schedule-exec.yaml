# CI de Nível 02 - Execução agendada

# nome da pipeline
name: "Schedule Execution"

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispach

on:
    workflow_dispatch:
    schedule:
      # Executa a cada hora (em UTC)
      # Validação de timezone feita em tempo de execução no primeiro step
      - cron: '0 * * * *'

permissions:
    contents: read
    actions: read

# tarefas dentro da pipeline = jobs

jobs:
    #nome do job
    e2e-tests:
        # maquina onde o job vai rodar
        runs-on: ubuntu-latest

        #passos do job
        steps:
            # Validar horário em São Paulo (21:56)
            - name: Validar horário (São Paulo/Brasília)
              env:
                TZ: America/Sao_Paulo
              run: |
                HORA=$(date +%H:%M)
                echo "Hora atual em São Paulo: $HORA"
                if [[ "$HORA" != "22:00" ]]; then
                  echo "Não é 22:00 em São Paulo. Abortando execução."
                  exit 1
                fi
                echo "✓ Horário correto! Prosseguindo com os testes..."

            #clone do projeto
            - uses: actions/checkout@v4

            # instalação do node
            - uses: actions/setup-node@v4
              with:
                node-version: 24.x

            # instalação do Yarn
            - name: Instalando Yarn
              run: npm install -g yarn

            # instalação das dependências
            - name: Instalando dependências
              run: yarn

            # instalação dos Browser do Playwright
            - name: Instalando Browser do Playwright
              run: yarn playwright install

            # executar os testes e2e
            - name: Executando testes e2e
              run: yarn run e2e