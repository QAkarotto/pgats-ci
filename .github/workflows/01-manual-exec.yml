# CI de Nível 01 - Disparo Manual através de clique

# nome da pipeline
name: "Execução Manual"

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispatch

on:
    workflow_dispatch:

# tarefas dentro da pipeline = jobs

jobs:
    # nome do job
    e2e-tests:

        # maquina onde o job vai rodar
        runs-on: ubuntu-latest

        # passos do job
        steps:

            # clone do projeto
            - uses: actions/checkout@v4

            # instalação do node
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.x

            # instalação do Yarn
            - name: Instalando Yarn
              run: npm install -g yarn

            # instalação das dependências
            - name: Instalando dependências
              run: yarn

            - name: Test Reporter
              uses: dorny/test-reporter@v3.0.0

            # instalação dos Browsers do Playwright
            - name: Instalando Browsers do Playwright
              run: yarn playwright install

            # executar os testes e2e
            - name: Executando testes e2e
              run: yarn run e2e

            # publicação do relatório de testes
            - name: Publicando relatório de testes
              uses: dorny/test-reporter@v1
              if: always()
              with:
                  name: Resultado dos Testes E2E
                  path: test-results/results.xml
                  reporter: java-junit